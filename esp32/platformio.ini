; Evolve – Firmware für ESP32-2424S012C (ESP32-C3, GC9A01 240×240 rund, CST816D Touch)
; Plan: docs/esp32-port.md

[platformio]
default_envs = board

[env:board]
platform = espressif32@6.9.0
framework = arduino
; Generische C3-Definition + eigene Pins (include/board.h) statt rzeldent-Plattform
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.1.16
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    ; USB-CDC: Serial läuft über die USB-C-Buchse
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
